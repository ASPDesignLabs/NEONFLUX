<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>NeonFlux OG Card Source</title>
<style>
  :root {
    --void: #050505;
    --graphite: #121212;
    --border: #2a2a2a;
    --text: #e8e8e8;
    --text-dim: #a8a8a8;
    --cyan: #00f3ff;
    --pink: #ff0055;
    --font-display: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Consolas, monospace;
  }
  html, body { margin: 0; padding: 0; }
  .card {
    width: 1200px; height: 630px;
    background: var(--void);
    background-image:
      linear-gradient(rgba(0,243,255,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,243,255,0.06) 1px, transparent 1px);
    background-size: 40px 40px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: var(--font-display);
    color: var(--text);
    position: relative;
    box-sizing: border-box;
  }
  .glyph { width: 120px; height: 120px; margin-bottom: 28px; }
  .wordmark {
    font-size: 64px; font-weight: 900; letter-spacing: 6px;
    color: var(--cyan);
    text-shadow: 0 0 40px rgba(0,243,255,0.5);
    margin: 0;
  }
  .wordmark .slash { color: var(--pink); }
  .tagline {
    font-size: 24px; letter-spacing: 3px; color: var(--pink);
    text-shadow: 0 0 24px rgba(255,0,85,0.5);
    margin: 18px 0 0;
  }
  .footer-row {
    position: absolute; bottom: 36px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 40px;
    font-size: 16px; color: var(--text-dim); letter-spacing: 2px;
  }
  .footer-row span { border: 1px solid var(--border); padding: 6px 14px; background: var(--graphite); }
</style>
</head>
<body>
  <div class="card">
    <svg class="glyph" viewBox="0 0 32 32" aria-hidden="true">
      <g fill="none" stroke="#ff0055" stroke-width="2" stroke-linecap="round">
        <path d="M9 8 Q3 16 9 24" stroke="#00f3ff"/>
        <path d="M23 8 Q29 16 23 24"/>
        <circle cx="16" cy="16" r="4"/>
      </g>
    </svg>
    <h1 class="wordmark">NEON <span class="slash">//</span> FLUX</h1>
    <p class="tagline">INVISIBLE. REACTIVE. READY WHEN YOU ARE.</p>
    <div class="footer-row">
      <span>REACTOR</span>
      <span>CLINICAL</span>
      <span>WEAR OS + ANDROID</span>
    </div>
  </div>
</body>
</html>
